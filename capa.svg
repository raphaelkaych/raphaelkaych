<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="rk-title rk-description">
  <title id="rk-title">Raphael Kaych</title>
  <desc id="rk-description">Software que passa pelo teste. Desenvolvimento, integrações e qualidade de software. Uma requisição atravessa interface, API e dados: a válida recebe 201 e a sem permissão recebe 403 sem gravar dados.</desc>
  <defs>
    <linearGradient id="rk-background" x2="0" y2="1">
      <stop stop-color="#071022"/>
      <stop offset=".7" stop-color="#05070d"/>
    </linearGradient>
    <radialGradient id="rk-aura" cx=".8" cy=".1" r=".55">
      <stop stop-color="#377ffb" stop-opacity=".3"/>
      <stop offset="1" stop-color="#377ffb" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="rk-bench" cx=".5" cy=".55" r=".6">
      <stop stop-color="#12305a" stop-opacity=".55"/>
      <stop offset="1" stop-color="#12305a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rk-node" x2="0" y2="1">
      <stop stop-color="#132a4a"/>
      <stop offset="1" stop-color="#08101f"/>
    </linearGradient>
    <clipPath id="rk-frame"><rect width="1200" height="400" rx="20"/></clipPath>
  </defs>

  <g clip-path="url(#rk-frame)">
    <rect width="1200" height="400" fill="url(#rk-background)"/>
    <rect width="1200" height="400" fill="url(#rk-aura)"/>

    <g font-family="Segoe UI, -apple-system, Helvetica Neue, Arial, sans-serif">
      <path d="M64 92h34" stroke="#377ffb" stroke-width="3" stroke-linecap="round"/>
      <text x="112" y="98" fill="#a9bad2" font-size="19" font-weight="500">Desenvolvimento, integrações e qualidade de software</text>
      <text x="60" y="186" fill="#f1f6ff" font-size="74" font-weight="700" letter-spacing="-2.6">Raphael Kaych</text>
      <text x="62" y="240" fill="#f1f6ff" font-size="34" font-weight="600" letter-spacing="-.8">Software que passa pelo teste.</text>
      <text x="64" y="318" fill="#a9bad2" font-size="18">ADS na Fatec Praia Grande. Demos, código e testes abertos.</text>
    </g>

    <!-- The bench: one request, two outcomes -->
    <rect x="640" y="56" width="500" height="288" rx="22" fill="#060b17" stroke="#2b4469"/>
    <rect x="640" y="56" width="500" height="288" rx="22" fill="url(#rk-bench)"/>
    <g fill="none" stroke="#2b4469" stroke-width="1.6">
      <path d="M760 168h40M900 168h40"/>
      <path d="M990 214v28q0 14-14 14H724q-14 0-14-14v-28" stroke-dasharray="4 7"/>
    </g>
    <path d="M760 168h40" stroke="#8bbcff" stroke-width="2.2"/>
    <circle cx="786" cy="168" r="4" fill="#d2e7ff"/>

    <g font-family="Segoe UI, -apple-system, Helvetica Neue, Arial, sans-serif" text-anchor="middle">
      <g transform="translate(660 124)">
        <rect width="100" height="92" rx="14" fill="url(#rk-node)" stroke="#8abaff" stroke-width="1.6"/>
        <g fill="none" stroke="#8bbcff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" transform="translate(36 18)">
          <rect width="28" height="22" rx="4"/><path d="M0 6h28M7 11l4 3-4 3M15 18h6"/>
        </g>
        <text x="50" y="66" fill="#e2eeff" font-size="14" font-weight="600">Interface</text>
      </g>
      <g transform="translate(800 124)">
        <rect width="100" height="92" rx="14" fill="url(#rk-node)" stroke="#ffb481" stroke-width="1.6"/>
        <g fill="none" stroke="#8bbcff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" transform="translate(36 16)">
          <path d="M8 2 0 12l8 10M20 2l8 10-8 10M17-1l-6 26"/>
        </g>
        <text x="50" y="66" fill="#e2eeff" font-size="14" font-weight="600">API</text>
      </g>
      <g transform="translate(940 124)">
        <rect width="100" height="92" rx="14" fill="url(#rk-node)" stroke="#2b4469" stroke-width="1.6"/>
        <g fill="none" stroke="#8bbcff" stroke-width="1.7" stroke-linecap="round" transform="translate(36 14)">
          <ellipse cx="14" cy="3" rx="13" ry="4.5"/><path d="M1 3v18c0 6 26 6 26 0V3M1 12c0 6 26 6 26 0"/>
        </g>
        <text x="50" y="66" fill="#e2eeff" font-size="14" font-weight="600">Dados</text>
      </g>
      <text x="850" y="290" fill="#8aa2c2" font-size="13">requisição e retorno</text>
    </g>

    <g font-family="Consolas, SFMono-Regular, Menlo, monospace" font-weight="700">
      <rect x="1062" y="82" width="58" height="30" rx="15" fill="#82dcb91f" stroke="#82dcb9" stroke-opacity=".6"/>
      <text x="1091" y="102" fill="#82dcb9" font-size="15" text-anchor="middle">201</text>
      <rect x="1062" y="124" width="58" height="30" rx="15" fill="#ffb4811f" stroke="#ffb481" stroke-opacity=".6"/>
      <text x="1091" y="144" fill="#ffb481" font-size="15" text-anchor="middle">403</text>
    </g>
  </g>
  <rect x=".5" y=".5" width="1199" height="399" rx="19.5" fill="none" stroke="#1b2c47"/>
</svg>
